<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mise en Place</title>

    <!-- Google Fonts: Playfair Display for headings, DM Sans for body text -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

    <style>
        /* =====================================================================
       CSS VARIABLES (THEME)
       Defining all colors here makes it easy to tweak the look in one place.
       ===================================================================== */
        
         :root {
            --cream: #f9f5ef;
            /* page background */
            --warm-white: #fffdf9;
            /* input / card background */
            --ink: #1a1510;
            /* main text color */
            --brown: #5c3d2e;
            /* primary brand color */
            --rust: #c0522a;
            /* delete / danger actions */
            --sage: #7a9e7e;
            /* success / cook button */
            --gold: #c9933a;
            /* accent on header */
            --muted: #8a7d72;
            /* secondary text */
            --border: #e0d5c8;
            /* card/input borders */
            --card: #ffffff;
            /* card background */
            --danger: #c0522a;
            /* low-stock / insufficient red */
            --success-bg: #2e5e3a;
            /* flash success message */
            --error-bg: #8b1a1a;
            /* flash error message */
        }
        /* Reset default browser margin/padding and use border-box sizing */
        
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
        }
        /* =====================================================================
       HEADER & NAVIGATION
       Sticky so it stays visible when scrolling.
       ===================================================================== */
        
        header {
            background: var(--ink);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            /* sits above all page content */
            border-bottom: 3px solid var(--gold);
        }
        
        .logo {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--cream);
            letter-spacing: 0.04em;
            padding: 1rem 0;
        }
        /* The <em> tag in the logo gets the gold accent color */
        
        .logo em {
            color: var(--gold);
            font-style: italic;
        }
        
        nav {
            display: flex;
            gap: 0.25rem;
        }
        /* Nav buttons are unstyled by default */
        
        nav button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            cursor: pointer;
            padding: 0.6rem 1rem;
            border-bottom: 2px solid transparent;
            /* placeholder for active underline */
            transition: color 0.2s, border-color 0.2s;
        }
        
        nav button:hover {
            color: var(--cream);
        }
        /* The active nav button gets a gold underline */
        
        nav button.active {
            color: var(--gold);
            border-bottom-color: var(--gold);
        }
        /* =====================================================================
       MAIN CONTENT AREA
       ===================================================================== */
        
        main {
            max-width: 960px;
            margin: 0 auto;
            padding: 2.5rem 1.5rem 4rem;
        }
        /* =====================================================================
       FLASH NOTIFICATIONS
       Fixed top-right corner; stacks multiple messages vertically.
       ===================================================================== */
        
        #flash-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        
        .flash {
            padding: 0.85rem 1.25rem;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #fff;
            max-width: 320px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            animation: slideIn 0.25s ease;
            /* slides in from right on creation */
        }
        
        .flash.success {
            background: var(--success-bg);
        }
        
        .flash.error {
            background: var(--error-bg);
        }
        /* Flash slides in from the right when it appears */
        
        @keyframes slideIn {
            from {
                transform: translateX(120%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        /* Flash fades out to the right before being removed from the DOM */
        
        @keyframes fadeOut {
            to {
                opacity: 0;
                transform: translateX(120%);
            }
        }
        /* =====================================================================
       PAGE HEADERS
       Used at the top of list pages (Recipes, Pantry).
       ===================================================================== */
        
        .page-header {
            margin-bottom: 2rem;
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
        }
        
        .page-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--brown);
        }
        /* =====================================================================
       BUTTONS
       All buttons share the .btn base class; color modifiers change them.
       ===================================================================== */
        
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-weight: 500;
            font-size: 0.875rem;
            transition: background 0.15s, transform 0.1s;
            padding: 0.55rem 1.1rem;
            white-space: nowrap;
        }
        /* Slight shrink on click for tactile feel */
        
        .btn:active {
            transform: scale(0.97);
        }
        
        .btn-primary {
            background: var(--brown);
            color: #fff;
        }
        
        .btn-primary:hover {
            background: #4a2e20;
        }
        
        .btn-success {
            background: var(--sage);
            color: #fff;
        }
        
        .btn-success:hover {
            background: #5f8463;
        }
        
        .btn-danger {
            background: var(--rust);
            color: #fff;
        }
        
        .btn-danger:hover {
            background: #a03e1e;
        }
        
        .btn-outline {
            background: transparent;
            color: var(--brown);
            border: 1.5px solid var(--brown);
        }
        
        .btn-outline:hover {
            background: var(--brown);
            color: #fff;
        }
        
        .btn-ghost {
            background: transparent;
            color: var(--muted);
            border: 1.5px solid var(--border);
        }
        
        .btn-ghost:hover {
            border-color: var(--muted);
            color: var(--ink);
        }
        /* Scale buttons on the recipe detail page (½×, 1×, 2×) */
        
        .btn-scale {
            background: var(--cream);
            color: var(--brown);
            border: 1.5px solid var(--border);
            padding: 0.4rem 0.85rem;
        }
        
        .btn-scale.selected {
            background: var(--brown);
            color: #fff;
            border-color: var(--brown);
        }
        /* =====================================================================
       RECIPE CARD GRID
       Auto-fills columns, minimum 260px each.
       ===================================================================== */
        
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.25rem;
        }
        
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            /* clips image corners */
            transition: box-shadow 0.2s, transform 0.2s;
        }
        /* Lift card slightly on hover for depth effect */
        
        .card:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.09);
            transform: translateY(-2px);
        }
        
        .card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            /* crops the image to fill the area */
            display: block;
            background: var(--border);
        }
        /* Shown when a recipe has no image URL, or if the image fails to load */
        
        .card-img-placeholder {
            width: 100%;
            height: 160px;
            background: linear-gradient(135deg, #ede8e0, #d8cfc3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }
        
        .card-body {
            padding: 1rem 1.1rem 1.1rem;
        }
        
        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.35rem;
            color: var(--ink);
        }
        
        .card-meta {
            font-size: 0.8rem;
            color: var(--muted);
            margin-bottom: 0.75rem;
        }
        
        .card-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        /* =====================================================================
       PANTRY INGREDIENT LIST
       Vertical stack of rows.
       ===================================================================== */
        
        .ingredient-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        
        .ingredient-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }
        
        .ingredient-name {
            font-weight: 500;
            font-size: 0.95rem;
        }
        
        .ingredient-qty {
            font-size: 0.85rem;
            color: var(--muted);
        }
        /* Low-stock: name turns red, qty goes bold red */
        
        .low-stock .ingredient-name {
            color: var(--danger);
        }
        
        .low-stock .ingredient-qty {
            font-weight: 700;
            color: var(--danger);
        }
        /* =====================================================================
       FORMS
       ===================================================================== */
        
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.75rem 2rem;
            max-width: 600px;
        }
        
        .form-card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem;
            color: var(--brown);
            margin-bottom: 1.25rem;
        }
        
        .form-group {
            margin-bottom: 1.1rem;
        }
        /* Small uppercase labels above each field */
        
        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 0.35rem;
        }
        /* Shared styles for all text inputs, number inputs, URL inputs, textareas, selects */
        
        input[type="text"],
        input[type="number"],
        input[type="url"],
        textarea,
        select {
            width: 100%;
            padding: 0.6rem 0.85rem;
            border: 1.5px solid var(--border);
            border-radius: 6px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            color: var(--ink);
            background: var(--warm-white);
            transition: border-color 0.15s;
        }
        /* Brown border on focus to match brand color */
        
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: var(--brown);
        }
        
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        /* Small italic helper text shown below a field */
        
        .form-tip {
            font-size: 0.76rem;
            color: var(--muted);
            margin-top: 0.25rem;
            font-style: italic;
        }
        /* Two fields side-by-side */
        
        .form-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
        }
        
        .form-row .form-group {
            flex: 1;
            min-width: 100px;
        }
        
        .form-actions {
            display: flex;
            gap: 0.75rem;
            margin-top: 1.5rem;
            flex-wrap: wrap;
        }
        /* =====================================================================
       RECIPE INGREDIENT ROWS (inside recipe form)
       Each row = ingredient picker + qty input + unit select + remove button
       ===================================================================== */
        
        .recipe-ing-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 0.75rem;
        }
        
        .recipe-ing-row {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--cream);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            flex-wrap: wrap;
        }
        /* Each child stretches to fill available space */
        
        .recipe-ing-row select,
        .recipe-ing-row input {
            flex: 1;
            min-width: 70px;
            width: auto;
        }
        
        .recipe-ing-row .btn {
            flex-shrink: 0;
        }
        /* =====================================================================
       RECIPE DETAIL / VIEW PAGE
       ===================================================================== */
        
        .recipe-detail {
            max-width: 680px;
        }
        
        .recipe-detail img {
            width: 100%;
            max-height: 320px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 1.5rem;
        }
        
        .recipe-detail h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2rem;
            color: var(--brown);
            margin-bottom: 0.5rem;
        }
        /* Scale button row */
        
        .scale-controls {
            display: flex;
            gap: 0.5rem;
            margin: 1.25rem 0;
            align-items: center;
        }
        
        .scale-controls span {
            font-size: 0.85rem;
            color: var(--muted);
            margin-right: 0.25rem;
        }
        /* Ingredient sufficiency table */
        
        .ing-table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
        }
        
        .ing-table th {
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            padding: 0.5rem 0.5rem;
        }
        
        .ing-table td {
            padding: 0.55rem 0.5rem;
            border-bottom: 1px solid #f0ebe3;
            font-size: 0.9rem;
        }
        /* Ingredients you don't have enough of show red + bold */
        
        .insufficient {
            color: var(--danger) !important;
            font-weight: 700;
        }
        /* pre-wrap preserves newlines in multi-line instructions */
        
        .recipe-instructions {
            margin-top: 1.5rem;
            line-height: 1.75;
            font-size: 0.95rem;
            color: var(--ink);
            white-space: pre-wrap;
        }
        /* Small uppercase divider labels (e.g. "Instructions", "Add Package Amount") */
        
        .section-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
        }
        /* =====================================================================
       FILTER BAR (search above pantry list)
       ===================================================================== */
        
        .filter-bar {
            margin-bottom: 1.25rem;
        }
        
        .filter-bar input {
            max-width: 320px;
        }
        /* =====================================================================
       HOME PAGE
       ===================================================================== */
        
        .home-hero {
            text-align: center;
            padding: 4rem 1rem;
        }
        
        .home-hero h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-style: italic;
            color: var(--brown);
            margin-bottom: 1rem;
        }
        
        .home-hero p {
            font-size: 1.1rem;
            color: var(--muted);
            max-width: 480px;
            margin: 0 auto 2rem;
            line-height: 1.7;
        }
        /* Three stat cards on the home page */
        
        .home-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.25rem;
            max-width: 640px;
            margin: 0 auto;
        }
        
        .home-stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.5rem;
            text-align: center;
        }
        
        .home-stat-card .stat-num {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--brown);
            font-weight: 700;
        }
        
        .home-stat-card .stat-label {
            font-size: 0.85rem;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.07em;
            margin-top: 0.25rem;
        }
        /* =====================================================================
       MISC UTILITIES
       ===================================================================== */
        
        .divider {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5rem 0;
        }
        /* Centered placeholder shown when a list is empty */
        
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--muted);
        }
        
        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 0.75rem;
        }
        
        .empty-state p {
            font-size: 0.95rem;
        }
        /* Small pill label showing ingredient type */
        
        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            padding: 0.2rem 0.55rem;
            border-radius: 99px;
            background: var(--border);
            color: var(--muted);
        }
        
        .badge-measured {
            background: #e8f0ea;
            color: #4a7a50;
        }
        
        .badge-discrete {
            background: #f0ebe3;
            color: #8a6030;
        }
        /* =====================================================================
       RESPONSIVE: adjustments for small screens
       ===================================================================== */
        
        @media (max-width: 600px) {
            header {
                padding: 0 1rem;
            }
            .logo {
                font-size: 1.2rem;
            }
            nav button {
                padding: 0.5rem 0.65rem;
                font-size: 0.75rem;
            }
            .form-card {
                padding: 1.25rem 1rem;
            }
            .home-hero h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">mise <em>en place</em></div>
        <nav>
            <!-- Each button calls navigate() with the page name as a string -->
            <button id="nav-home" class="active" onclick="navigate('home')">Home</button>
            <button id="nav-recipes" onclick="navigate('recipes')">Recipes</button>
            <button id="nav-ingredients" onclick="navigate('ingredients')">Pantry</button>
        </nav>
    </header>

    <!-- Flash notifications are injected here by showFlash() -->
    <div id="flash-container"></div>

    <!-- All page content is rendered into this element by navigate() -->
    <main id="main-content"></main>

    <script>
        /* =====================================================================
                                                                           STORAGE HELPERS
                                                                           We store all data in localStorage as JSON strings.
                                                                           Two keys: "ingredients" (pantry) and "recipes".
                                                                           ===================================================================== */

        // Load the ingredients array from localStorage, or return [] if nothing stored
        function loadIngredients() {
            try {
                return JSON.parse(localStorage.getItem('ingredients')) || [];
            } catch (e) {
                return [];
            } // if stored JSON is corrupted, start fresh
        }

        // Save the full ingredients array back to localStorage
        function saveIngredients(list) {
            localStorage.setItem('ingredients', JSON.stringify(list));
        }

        // Load the recipes array from localStorage, or return []
        function loadRecipes() {
            try {
                return JSON.parse(localStorage.getItem('recipes')) || [];
            } catch (e) {
                return [];
            }
        }

        // Save the full recipes array back to localStorage
        function saveRecipes(list) {
            localStorage.setItem('recipes', JSON.stringify(list));
        }

        /* =====================================================================
           UNIT CONVERSION
           Supported unit groups:
             Volume (tsp-based):  tsp, tbsp, cup
             Volume (ml-based):   ml — can also cross-convert with tsp/tbsp/cup
             Weight:              g, oz
             Discrete:            unit (no conversion; eggs are eggs)

           Returns null when units are incompatible (e.g., cups → grams).
           ===================================================================== */

        // How many teaspoons are in each tsp-group volume unit?
        const TSP_EQUIV = {
            tsp: 1,
            tbsp: 3,
            cup: 48
        };

        // How many milliliters are in each volume unit?
        // This bridge allows converting ml ↔ tsp/tbsp/cup
        const ML_EQUIV = {
            tsp: 4.92892,
            tbsp: 14.7868,
            cup: 236.588,
            ml: 1
        };

        // How many grams are in each weight unit?
        const G_EQUIV = {
            g: 1,
            oz: 28.3495
        };

        function convertToCanonical(qty, fromUnit, toUnit) {
            // No conversion needed if units match
            if (fromUnit === toUnit) return qty;

            // "unit" is discrete — can't convert to or from anything else
            if (fromUnit === 'unit' || toUnit === 'unit') return null;

            // Try tsp-based volume conversion (tsp ↔ tbsp ↔ cup)
            const fromTsp = TSP_EQUIV[fromUnit];
            const toTsp = TSP_EQUIV[toUnit];
            if (fromTsp !== undefined && toTsp !== undefined) {
                return qty * (fromTsp / toTsp);
            }

            // Try ml-based volume conversion (bridges ml ↔ tsp/tbsp/cup)
            const fromMl = ML_EQUIV[fromUnit];
            const toMl = ML_EQUIV[toUnit];
            if (fromMl !== undefined && toMl !== undefined) {
                return qty * (fromMl / toMl);
            }

            // Try weight conversion (g ↔ oz)
            const fromG = G_EQUIV[fromUnit];
            const toG = G_EQUIV[toUnit];
            if (fromG !== undefined && toG !== undefined) {
                return qty * (fromG / toG);
            }

            // Incompatible unit groups (e.g. volume → weight) — return null to signal error
            return null;
        }

        /* =====================================================================
        QUANTITY FORMATTING
        Converts decimal numbers into human-readable fractions where possible.
        e.g.  0.25 → "1/4"   1.5 → "1 1/2"   2.33 → "2.33"
        ===================================================================== */

        // Common fractions paired with their decimal values
        const FRACTIONS = [
            [1 / 8, '1/8'],
            [1 / 4, '1/4'],
            [1 / 3, '1/3'],
            [3 / 8, '3/8'],
            [1 / 2, '1/2'],
            [5 / 8, '5/8'],
            [2 / 3, '2/3'],
            [3 / 4, '3/4'],
            [7 / 8, '7/8']
        ];

        function formatQty(num) {
            // Handle missing or invalid values gracefully
            if (num === null || num === undefined || isNaN(num)) return '—';

            // Clamp to zero — never show a negative quantity in the UI
            num = Math.max(0, num);

            const whole = Math.floor(num); // integer part
            const frac = num - whole; // decimal remainder

            // Check if the decimal part is close to a known fraction
            let fracStr = '';
            for (const [val, str] of FRACTIONS) {
                if (Math.abs(frac - val) < 0.015) { // 0.015 tolerance handles float imprecision
                    fracStr = str;
                    break;
                }
            }

            if (fracStr) {
                // Combine whole + fraction: e.g. 1.5 → "1 1/2", 0.25 → "1/4"
                return whole > 0 ? `${whole} ${fracStr}` : fracStr;
            }

            // Fall back to integer or trimmed decimal
            if (Number.isInteger(num)) return String(num);
            return parseFloat(num.toFixed(2)).toString();
        }

        // Returns "unit" or "units" depending on whether quantity is exactly 1
        function pluralizeUnit(qty, unit) {
            if (unit === 'unit' && qty !== 1) return 'units';
            return unit;
        }

        /* =====================================================================
        FLASH NOTIFICATIONS
        Creates a temporary banner that slides in from the right and
        automatically fades out after ~3.5 seconds.
           ===================================================================== */

        function showFlash(message, type = 'success') {
            const container = document.getElementById('flash-container');

            const div = document.createElement('div');
            div.className = `flash ${type}`;
            div.innerText = message; // innerText safely escapes any HTML — no XSS risk

            container.appendChild(div);

            // After 3.5s, animate out, then remove from DOM once animation ends
            setTimeout(() => {
                div.style.animation = 'fadeOut 0.4s forwards';
                setTimeout(() => div.remove(), 400);
            }, 3500);
        }

        /* =====================================================================
           NAVIGATION / SPA ROUTER
           All pages are rendered by navigate(). It clears <main>, then calls
           the appropriate render function for the requested page.

           Pages:
             'home'        — welcome page with stats
             'recipes'     — recipe card list
             'recipe-form' — add/edit recipe (extra = recipe ID or null)
             'recipe-view' — recipe detail (extra = recipe ID)
             'ingredients' — pantry list
             'ing-form'    — add/top-up ingredient (extra = ingredient ID or null)
           ===================================================================== */

        let currentPage = 'home';

        function navigate(page, extra) {
            currentPage = page;

            // Highlight the matching top-level nav button
            // (only 'home', 'recipes', 'ingredients' have nav buttons)
            ['home', 'recipes', 'ingredients'].forEach(p => {
                document.getElementById(`nav-${p}`).classList.toggle('active', p === page);
            });

            const main = document.getElementById('main-content');

            // Clear existing page content without using innerHTML (XSS-safe)
            while (main.firstChild) main.removeChild(main.firstChild);

            // Dispatch to the right render function
            if (page === 'home') renderHome(main);
            else if (page === 'recipes') renderRecipeList(main);
            else if (page === 'recipe-form') renderRecipeForm(main, extra);
            else if (page === 'recipe-view') renderRecipeView(main, extra);
            else if (page === 'ingredients') renderIngredientList(main);
            else if (page === 'ing-form') renderIngredientForm(main, extra);
        }

        /* =====================================================================
           HOME PAGE
           Displays a welcome message and three live stat cards pulled from
           localStorage.
           ===================================================================== */

        function renderHome(container) {
            const hero = document.createElement('div');
            hero.className = 'home-hero';

            const h1 = document.createElement('h1');
            h1.innerText = 'Your Kitchen, Organized.';

            const p = document.createElement('p');
            p.innerText = 'Manage your pantry and recipes. Cook a recipe to automatically subtract ingredients from your pantry.';

            const cards = document.createElement('div');
            cards.className = 'home-cards';

            // Read current data to populate stats
            const ingredients = loadIngredients();
            const recipes = loadRecipes();
            const lowCount = ingredients.filter(i => isLowStock(i)).length;

            // Helper: build one stat card with a big number and a label
            const makeStatCard = (num, label) => {
                const card = document.createElement('div');
                card.className = 'home-stat-card';

                const numEl = document.createElement('div');
                numEl.className = 'stat-num';
                numEl.innerText = num;

                const lblEl = document.createElement('div');
                lblEl.className = 'stat-label';
                lblEl.innerText = label;

                card.appendChild(numEl);
                card.appendChild(lblEl);
                return card;
            };

            cards.appendChild(makeStatCard(ingredients.length, 'Pantry Items'));
            cards.appendChild(makeStatCard(recipes.length, 'Saved Recipes'));
            cards.appendChild(makeStatCard(lowCount, 'Low Stock'));

            hero.appendChild(h1);
            hero.appendChild(p);
            hero.appendChild(cards);
            container.appendChild(hero);
        }

        // Returns true if this ingredient is considered "low stock"
        function isLowStock(ing) {
            if (ing.type === 'discrete') return ing.canonicalQty < 3; // fewer than 3 items
            return ing.canonicalQty < 1; // less than 1 canonical unit
        }

        /* =====================================================================
           PANTRY (INGREDIENT) LIST
           Shows all pantry items sorted by quantity ascending (lowest first),
           with a live text search filter at the top.
           ===================================================================== */

        function renderIngredientList(container) {
            // Page header row: title on left, "Add" button on right
            const header = document.createElement('div');
            header.className = 'page-header';

            const h1 = document.createElement('h1');
            h1.innerText = 'Pantry';

            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-primary';
            addBtn.innerText = '+ Add Ingredient';
            addBtn.onclick = () => navigate('ing-form', null); // null = no ID = new ingredient

            header.appendChild(h1);
            header.appendChild(addBtn);
            container.appendChild(header);

            // Search input — filters list in real-time as user types
            const filterBar = document.createElement('div');
            filterBar.className = 'filter-bar';

            const filterInput = document.createElement('input');
            filterInput.type = 'text';
            filterInput.placeholder = 'Search pantry…';
            filterInput.oninput = () => renderList(filterInput.value.toLowerCase());

            filterBar.appendChild(filterInput);
            container.appendChild(filterBar);

            // Wrapper div that gets re-built every time the filter changes
            const listDiv = document.createElement('div');
            container.appendChild(listDiv);

            // Builds (or rebuilds) the ingredient rows from scratch
            function renderList(filter = '') {
                // Clear the previous list safely
                while (listDiv.firstChild) listDiv.removeChild(listDiv.firstChild);

                let ings = loadIngredients();

                // Apply name filter (case-insensitive substring match)
                if (filter) ings = ings.filter(i => i.name.toLowerCase().includes(filter));

                // Sort ascending by canonical quantity so lowest-stock items appear first
                ings.sort((a, b) => a.canonicalQty - b.canonicalQty);

                // Show empty state if nothing is in the pantry (or nothing matches filter)
                if (ings.length === 0) {
                    const empty = document.createElement('div');
                    empty.className = 'empty-state';
                    const icon = document.createElement('div');
                    icon.className = 'icon';
                    icon.innerText = '🥫';
                    const p = document.createElement('p');
                    p.innerText = 'No pantry items yet. Add your first ingredient!';
                    empty.appendChild(icon);
                    empty.appendChild(p);
                    listDiv.appendChild(empty);
                    return;
                }

                const ul = document.createElement('div');
                ul.className = 'ingredient-list';

                ings.forEach(ing => {
                    const row = document.createElement('div');
                    row.className = 'ingredient-item';

                    // Add the low-stock CSS class so the row turns red
                    if (isLowStock(ing)) row.classList.add('low-stock');

                    // LEFT: ingredient name + type badge
                    const left = document.createElement('div');

                    const nameEl = document.createElement('span');
                    nameEl.className = 'ingredient-name';
                    nameEl.innerText = ing.name; // innerText — XSS safe

                    const badge = document.createElement('span');
                    badge.className = `badge badge-${ing.type}`;
                    badge.innerText = ing.type;

                    left.appendChild(nameEl);
                    left.appendChild(document.createTextNode(' '));
                    left.appendChild(badge);

                    // RIGHT: qty display + action buttons
                    const right = document.createElement('div');
                    right.style.cssText = 'display:flex; align-items:center; gap:0.75rem; flex-wrap:wrap;';

                    // Show quantity with appropriate unit label
                    const qtyEl = document.createElement('span');
                    qtyEl.className = 'ingredient-qty';
                    const displayUnit = ing.type === 'discrete' ?
                        pluralizeUnit(ing.canonicalQty, 'unit') // "unit" or "units"
                        :
                        ing.canonicalUnit; // e.g. "cup", "g"
                    qtyEl.innerText = `${formatQty(ing.canonicalQty)} ${displayUnit}`;

                    const editBtn = document.createElement('button');
                    editBtn.className = 'btn btn-ghost';
                    editBtn.innerText = '✏️ Edit / Top Up';
                    editBtn.onclick = () => navigate('ing-form', ing.id); // pass ID to form

                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn btn-danger';
                    delBtn.innerText = 'Delete';
                    delBtn.onclick = () => deleteIngredient(ing.id);

                    right.appendChild(qtyEl);
                    right.appendChild(editBtn);
                    right.appendChild(delBtn);

                    row.appendChild(left);
                    row.appendChild(right);
                    ul.appendChild(row);
                });

                listDiv.appendChild(ul);
            }

            // Initial render with no filter applied
            renderList();
        }

        // Deletes an ingredient — blocked if any recipe still references it
        function deleteIngredient(id) {
            const recipes = loadRecipes();
            const inUse = recipes.some(r => r.ingredients.some(ri => ri.ingredientId === id));
            if (inUse) {
                showFlash('Cannot delete — this ingredient is used in a recipe.', 'error');
                return;
            }

            saveIngredients(loadIngredients().filter(i => i.id !== id));
            showFlash('Ingredient deleted.');
            navigate('ingredients');
        }

        /* =====================================================================
           INGREDIENT FORM (Add new OR Top Up existing)
           Behavior changes based on whether editId is provided:
             - editId = null  →  "Add Ingredient" form
             - editId = ID    →  "Top Up: [name]" form (name + type locked)
           ===================================================================== */

        function renderIngredientForm(container, editId) {
            const existingList = loadIngredients();
            const existing = editId ? existingList.find(i => i.id === editId) : null;
            const isEdit = !!existing;

            const formCard = document.createElement('div');
            formCard.className = 'form-card';

            // Title reflects mode

            formCard.appendChild(title);

            /* --- Name field --- */
            const nameGroup = makeFormGroup('Name', 'text', 'name', isEdit ? existing.name : '', 'e.g. All-Purpose Flour', true);
            const nameInput = nameGroup.querySelector('input');
            if (isEdit) nameInput.disabled = true; // can't rename an existing ingredient
            formCard.appendChild(nameGroup);

            /* --- Type dropdown (measured vs discrete) --- */
            const typeGroup = document.createElement('div');
            typeGroup.className = 'form-group';

            const typeLabel = document.createElement('label');
            typeLabel.innerText = 'Type';

            const typeSelect = document.createElement('select');
            ['measured', 'discrete'].forEach(t => {
                const opt = document.createElement('option');
                opt.value = t;
                opt.innerText = t.charAt(0).toUpperCase() + t.slice(1);
                if (isEdit && existing.type === t) opt.selected = true;
                typeSelect.appendChild(opt);
            });
            if (isEdit) typeSelect.disabled = true; // type is locked once created

            const typeTip = document.createElement('p');
            typeTip.className = 'form-tip';
            typeTip.innerText = 'Discrete: counted items (eggs, apples). Measured: amounts (flour, milk).';

            typeGroup.appendChild(typeLabel);
            typeGroup.appendChild(typeSelect);
            typeGroup.appendChild(typeTip);
            formCard.appendChild(typeGroup);

            /* --- Canonical unit selector (only visible for "measured" type) --- */
            const canonUnitGroup = document.createElement('div');
            canonUnitGroup.className = 'form-group';

            const canonUnitLabel = document.createElement('label');
            canonUnitLabel.innerText = 'Canonical Unit';

            const canonUnitSelect = document.createElement('select');
            ['tsp', 'tbsp', 'cup', 'ml', 'g', 'oz'].forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.innerText = u;
                if (isEdit && existing.canonicalUnit === u) opt.selected = true;
                canonUnitSelect.appendChild(opt);
            });
            if (isEdit) canonUnitSelect.disabled = true; // locked after creation

            const canonUnitTip = document.createElement('p');
            canonUnitTip.className = 'form-tip';
            canonUnitTip.innerText = 'The unit you normally use to measure this ingredient (e.g. "cup" for flour).';

            canonUnitGroup.appendChild(canonUnitLabel);
            canonUnitGroup.appendChild(canonUnitSelect);
            canonUnitGroup.appendChild(canonUnitTip);
            formCard.appendChild(canonUnitGroup);

            /* --- Package input section (how much stock to add) --- */
            const pkgSection = document.createElement('div');

            const hr = document.createElement('hr');
            hr.className = 'divider';
            pkgSection.appendChild(hr);

            const pkgHeading = document.createElement('p');
            pkgHeading.className = 'section-label';
            pkgHeading.innerText = isEdit ? 'Add Package Amount' : 'Initial Stock';
            pkgSection.appendChild(pkgHeading);

            // How many packages / units are you adding right now?
            const pkgQtyGroup = makeFormGroup('Package Quantity', 'number', 'pkgQty', '1', '1', true);
            const pkgQtyInput = pkgQtyGroup.querySelector('input');
            pkgQtyInput.min = '0';
            pkgQtyInput.step = 'any';
            pkgSection.appendChild(pkgQtyGroup);

            // What unit is the package labeled in?
            const pkgUnitGroup = document.createElement('div');
            pkgUnitGroup.className = 'form-group';
            const pkgUnitLabel = document.createElement('label');
            pkgUnitLabel.innerText = 'Package Unit';
            const pkgUnitSelect = document.createElement('select');
            pkgUnitGroup.appendChild(pkgUnitLabel);
            pkgUnitGroup.appendChild(pkgUnitSelect);
            pkgSection.appendChild(pkgUnitGroup);

            /* --- Serving-size input method --- */
            const servingSection = document.createElement('div');

            // Toggle between "direct conversion" and "via servings" calculation
            const servingModeGroup = document.createElement('div');
            servingModeGroup.className = 'form-group';
            const servingModeLabel = document.createElement('label');
            servingModeLabel.innerText = 'Input Method';
            const servingModeSelect = document.createElement('select');

            const optDirect = document.createElement('option');
            optDirect.value = 'direct';
            optDirect.innerText = 'Direct (package qty → canonical unit)';

            const optServings = document.createElement('option');
            optServings.value = 'servings';
            optServings.innerText = 'Via Servings (package qty × serving size)';

            servingModeSelect.appendChild(optDirect);
            servingModeSelect.appendChild(optServings);
            servingModeGroup.appendChild(servingModeLabel);
            servingModeGroup.appendChild(servingModeSelect);
            servingSection.appendChild(servingModeGroup);

            // Serving size fields — only shown when mode = "via servings"
            const servingDetails = document.createElement('div');
            servingDetails.style.display = 'none'; // hidden initially

            const servingRow = document.createElement('div');
            servingRow.className = 'form-row';

            const srvAmtGroup = makeFormGroup('Serving Size', 'number', 'srvAmt', '1', '1');
            const srvAmtInput = srvAmtGroup.querySelector('input');
            srvAmtInput.min = '0';
            srvAmtInput.step = 'any';

            const srvUnitGroup = document.createElement('div');
            srvUnitGroup.className = 'form-group';
            const srvUnitLabel = document.createElement('label');
            srvUnitLabel.innerText = 'Serving Unit';
            const srvUnitSelect = document.createElement('select');
            srvUnitGroup.appendChild(srvUnitLabel);
            srvUnitGroup.appendChild(srvUnitSelect);

            servingRow.appendChild(srvAmtGroup);
            servingRow.appendChild(srvUnitGroup);
            servingDetails.appendChild(servingRow);

            const srvTip = document.createElement('p');
            srvTip.className = 'form-tip';
            srvTip.innerText = 'E.g. if a box has 6 servings × 240ml each, enter qty=6, serving size=240 ml.';
            servingDetails.appendChild(srvTip);

            servingSection.appendChild(servingDetails);
            pkgSection.appendChild(servingSection);
            formCard.appendChild(pkgSection);

            /* --- Dynamically update UI when ingredient type changes --- */
            function updateTypeUI() {
                const isDiscrete = (typeSelect.value === 'discrete');

                // Discrete types don't need a canonical unit dropdown
                canonUnitGroup.style.display = isDiscrete ? 'none' : 'block';

                // Clear and repopulate unit dropdowns for package and serving
                while (pkgUnitSelect.firstChild) pkgUnitSelect.removeChild(pkgUnitSelect.firstChild);
                while (srvUnitSelect.firstChild) srvUnitSelect.removeChild(srvUnitSelect.firstChild);

                if (isDiscrete) {
                    // Lock everything to "unit" for discrete types
                    const opt = document.createElement('option');
                    opt.value = 'unit';
                    opt.innerText = 'unit(s)';
                    pkgUnitSelect.appendChild(opt);
                    pkgUnitGroup.style.display = 'none';
                    servingModeGroup.style.display = 'none';
                    servingDetails.style.display = 'none';
                } else {
                    // Measured: populate all standard cooking units
                    const units = ['tsp', 'tbsp', 'cup', 'ml', 'g', 'oz'];
                    units.forEach(u => {
                        const o1 = document.createElement('option');
                        o1.value = u;
                        o1.innerText = u;
                        pkgUnitSelect.appendChild(o1);

                        const o2 = document.createElement('option');
                        o2.value = u;
                        o2.innerText = u;
                        srvUnitSelect.appendChild(o2);
                    });

                    pkgUnitGroup.style.display = 'block';
                    servingModeGroup.style.display = 'block';

                    // Default the package/serving unit to match the canonical unit for convenience
                    const defaultUnit = isEdit ? existing.canonicalUnit : canonUnitSelect.value;
                    pkgUnitSelect.value = defaultUnit;
                    srvUnitSelect.value = defaultUnit;
                }
            }

            typeSelect.onchange = updateTypeUI; // re-run when user changes type
            updateTypeUI(); // run once on form load

            // Show/hide serving size fields when mode changes
            servingModeSelect.onchange = () => {
                servingDetails.style.display = servingModeSelect.value === 'servings' ? 'block' : 'none';
            };

            /* --- Save and Cancel buttons --- */
            const actions = document.createElement('div');
            actions.className = 'form-actions';

            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn btn-primary';
            saveBtn.innerText = isEdit ? 'Top Up & Save' : 'Add to Pantry';
            saveBtn.onclick = () => saveIngredient();

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-ghost';
            cancelBtn.innerText = 'Cancel';
            cancelBtn.onclick = () => navigate('ingredients');

            actions.appendChild(saveBtn);
            actions.appendChild(cancelBtn);
            formCard.appendChild(actions);
            container.appendChild(formCard);

            /* --- Save logic with full validation --- */
            function saveIngredient() {
                const name = nameInput.value.trim();
                const type = typeSelect.value;
                const pkgQty = parseFloat(pkgQtyInput.value);

                // Basic field validation
                if (!name) {
                    showFlash('Name is required.', 'error');
                    return;
                }
                if (isNaN(pkgQty) || pkgQty < 0) {
                    showFlash('Package quantity must be 0 or more.', 'error');
                    return;
                }

                let addedCanonical = 0; // the amount to add, expressed in the canonical unit

                if (type === 'discrete') {
                    // Discrete items must be whole numbers (round any decimal input)
                    addedCanonical = Math.round(pkgQty);

                } else {
                    // Measured: convert the package input to the canonical unit
                    const canonUnit = canonUnitSelect.value;
                    const mode = servingModeSelect.value;

                    if (mode === 'direct') {
                        // Convert package qty directly from its unit to the canonical unit
                        const pkgUnit = pkgUnitSelect.value;
                        const converted = convertToCanonical(pkgQty, pkgUnit, canonUnit);
                        if (converted === null) {
                            showFlash(`Cannot convert ${pkgUnit} to ${canonUnit}.`, 'error');
                            return;
                        }
                        addedCanonical = converted;

                    } else {
                        // Via servings: total = (number of servings) × (one serving in canonical unit)
                        const srvAmt = parseFloat(srvAmtInput.value);
                        const srvUnit = srvUnitSelect.value;

                        if (isNaN(srvAmt) || srvAmt <= 0) {
                            showFlash('Serving size must be positive.', 'error');
                            return;
                        }

                        const srvInCanon = convertToCanonical(srvAmt, srvUnit, canonUnit);
                        if (srvInCanon === null) {
                            showFlash(`Cannot convert serving unit ${srvUnit} to ${canonUnit}.`, 'error');
                            return;
                        }
                        addedCanonical = pkgQty * srvInCanon;
                    }
                }

                const list = loadIngredients();

                if (isEdit) {
                    // Top-up: add the new amount to the current quantity
                    const idx = list.findIndex(i => i.id === editId);
                    if (idx !== -1) {
                        list[idx].canonicalQty = Math.max(0, list[idx].canonicalQty + addedCanonical);
                        saveIngredients(list);
                        const unit = list[idx].type === 'discrete' ? 'units' : list[idx].canonicalUnit;
                        showFlash(`${existing.name} topped up! New qty: ${formatQty(list[idx].canonicalQty)} ${unit}`);
                    }

                } else {
                    // New ingredient: block duplicate names (case-insensitive)
                    if (list.some(i => i.name.toLowerCase() === name.toLowerCase())) {
                        showFlash('An ingredient with that name already exists.', 'error');
                        return;
                    }

                    list.push({
                        id: crypto.randomUUID(), // browser-native unique ID generator
                        name,
                        type,
                        canonicalUnit: type === 'discrete' ? 'unit' : canonUnitSelect.value,
                        canonicalQty: Math.max(0, addedCanonical) // never store negative
                    });
                    saveIngredients(list);
                    showFlash(`${name} added to pantry!`);
                }

                navigate('ingredients');
            }
        }

        /* =====================================================================

            formCard.appendChild(hr);

            const ingHeading = document.createElement('p');
            ingHeading.className = 'section-label';
            ingHeading.innerText = 'Ingredients';
            formCard.appendChild(ingHeading);

            // Working array of ingredient rows: [{ ingredientId, qty, unit }, ...]
            // Start with a copy of existing ingredients when editing
            let recipeIngs = isEdit ? existing.ingredients.map(ri => ({...ri
            })) : [];

            // Container where the ingredient rows are rendered
            const rowsContainer = document.createElement('div');
            rowsContainer.className = 'recipe-ing-list';
            formCard.appendChild(rowsContainer);

            // Adds a blank row with default values
            const addIngBtn = document.createElement('button');
            addIngBtn.className = 'btn btn-outline';
            addIngBtn.type = 'button';
            addIngBtn.innerText = '+ Add Ingredient';
            addIngBtn.onclick = () => {
                recipeIngs.push({
                    ingredientId: '',
                    qty: 1,
                    unit: 'unit'
                });
                renderIngRows();
            };
            formCard.appendChild(addIngBtn);

            // Renders all rows in recipeIngs as form controls
            function renderIngRows() {
                // Clear existing rows first
                while (rowsContainer.firstChild) rowsContainer.removeChild(rowsContainer.firstChild);

                const pantry = loadIngredients();

                // If the pantry is empty and rows were added, warn the user
                if (pantry.length === 0 && recipeIngs.length > 0) {
                    const warn = document.createElement('p');
                    warn.className = 'form-tip';
                    warn.innerText = 'No pantry ingredients yet. Add some first.';
                    rowsContainer.appendChild(warn);
                    return;
                }

                recipeIngs.forEach((ri, idx) => {
                    const row = document.createElement('div');
                    row.className = 'recipe-ing-row';

                    /* Ingredient dropdown — lists all pantry items */
                    const ingSelect = document.createElement('select');
                    const blankOpt = document.createElement('option');
                    blankOpt.value = '';
                    blankOpt.innerText = '— pick ingredient —';
                    ingSelect.appendChild(blankOpt);

                    pantry.forEach(ing => {
                        const opt = document.createElement('option');
                        opt.value = ing.id;
                        opt.innerText = ing.name;
                        if (ri.ingredientId === ing.id) opt.selected = true;
                        ingSelect.appendChild(opt);
                    });

                    ingSelect.onchange = () => {
                        recipeIngs[idx].ingredientId = ingSelect.value;
                        // Auto-lock unit select to "unit" for discrete ingredients (eggs can't be measured in tsp)
                        const chosen = pantry.find(p => p.id === ingSelect.value);
                        if (chosen && chosen.type === 'discrete') {
                            unitSelect.value = 'unit';
                            unitSelect.disabled = true;
                            recipeIngs[idx].unit = 'unit';
                        } else {
                            unitSelect.disabled = false;
                        }
                    };

                    /* Quantity input */
                    const qtyInput = document.createElement('input');
                    qtyInput.type = 'number';
                    qtyInput.min = '0';
                    qtyInput.step = 'any';
                    qtyInput.value = ri.qty || 1;
                    qtyInput.style.maxWidth = '80px';
                    qtyInput.oninput = () => {
                        recipeIngs[idx].qty = parseFloat(qtyInput.value) || 0;
                    };

                    /* Unit dropdown */
                    const unitSelect = document.createElement('select');
                    unitSelect.style.maxWidth = '80px';
                    ['unit', 'tsp', 'tbsp', 'cup', 'ml', 'g', 'oz'].forEach(u => {
                        const opt = document.createElement('option');
                        opt.value = u;
                        opt.innerText = u;
                        if (ri.unit === u) opt.selected = true;
                        unitSelect.appendChild(opt);
                    });
                    unitSelect.onchange = () => {
                        recipeIngs[idx].unit = unitSelect.value;
                    };

                    // If loading an existing row for a discrete ingredient, lock the unit immediately
                    const chosenIng = pantry.find(p => p.id === ri.ingredientId);
                    if (chosenIng && chosenIng.type === 'discrete') {
                        unitSelect.value = 'unit';
                        unitSelect.disabled = true;
                    }

                    /* Remove button — splices this row out of recipeIngs and re-renders */
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn btn-danger';
                    removeBtn.type = 'button';
                    removeBtn.innerText = '✕';
                    removeBtn.onclick = () => {
                        recipeIngs.splice(idx, 1); // remove exactly this row
                        renderIngRows();
                    };

                    row.appendChild(ingSelect);
                    row.appendChild(qtyInput);
                    row.appendChild(unitSelect);
                    row.appendChild(removeBtn);
                    rowsContainer.appendChild(row);
                });
            }

            // Initial render
            renderIngRows();

            /* --- Action buttons --- */
            const actions = document.createElement('div');
            actions.className = 'form-actions';

            const saveBtn = document.createElement('button');
            saveBtn.className = 'btn btn-primary';
            saveBtn.innerText = isEdit ? 'Save Changes' : 'Save Recipe';
            saveBtn.onclick = () => saveRecipe();

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'btn btn-ghost';
            cancelBtn.innerText = 'Cancel';
            cancelBtn.onclick = () => navigate('recipes');

            actions.appendChild(saveBtn);
            actions.appendChild(cancelBtn);
            formCard.appendChild(actions);
            container.appendChild(formCard);

            /* --- Save / validation --- */
            function saveRecipe() {
                const name = nameInput.value.trim();
                const imageUrl = formCard.querySelector('input[type="url"]').value.trim();
                const instructions = instrArea.value.trim();

                if (!name) {
                    showFlash('Recipe name is required.', 'error');
                    return;
                }
                if (!instructions) {
                    showFlash('Instructions are required.', 'error');
                    return;
                }

                // Validate every ingredient row before saving
                for (let i = 0; i < recipeIngs.length; i++) {
                    const ri = recipeIngs[i];
                    if (!ri.ingredientId) {
                        showFlash(`Row ${i+1}: please pick an ingredient.`, 'error');
                        return;
                    }
                    if (isNaN(ri.qty) || ri.qty <= 0) {
                        showFlash(`Row ${i+1}: quantity must be > 0.`, 'error');
                        return;
                    }
                }

                const list = loadRecipes();

                if (isEdit) {
                    // Find and update the existing recipe object in place
                    const idx = list.findIndex(r => r.id === editId);
                    if (idx !== -1) {
                        list[idx] = {...list[idx],
                            name,
                            imageUrl,
                            instructions,
                            ingredients: recipeIngs
                        };
                        saveRecipes(list);
                        showFlash(`"${name}" updated!`);
                    }
                } else {
                    // Add a brand-new recipe
                    list.push({
                        id: crypto.randomUUID(),
                        name,
                        imageUrl,
                        instructions,
                        ingredients: recipeIngs
                    });
                    saveRecipes(list);
                    showFlash(`"${name}" saved!`);
                }

                navigate('recipes');
            }
        }

        /* =====================================================================
           RECIPE VIEW (Detail Page)
           Displays recipe info with:
             - ½× / 1× / 2× scale buttons
             - Ingredient table with "Needed" vs "Have" columns
             - Red highlighting for insufficient ingredients
             - "Cook Recipe" button
             - Full instructions block
           ===================================================================== */

        function renderRecipeView(container, recipeId) {
            const recipe = loadRecipes().find(r => r.id === recipeId);
            if (!recipe) {
                showFlash('Recipe not found.', 'error');
                navigate('recipes');
                return;
            }

            let scale = 1; // starts at 1× (no scaling)

            const detail = document.createElement('div');
            detail.className = 'recipe-detail';

            /* Back button */
            const backBtn = document.createElement('button');
            backBtn.className = 'btn btn-ghost';
            backBtn.innerText = '← Back to Recipes';
            backBtn.onclick = () => navigate('recipes');
            detail.appendChild(backBtn);

            const hr0 = document.createElement('hr');
            hr0.className = 'divider';
            detail.appendChild(hr0);

            /* Recipe image — silently removed if URL is broken */
            if (recipe.imageUrl) {
                const img = document.createElement('img');
                img.src = recipe.imageUrl;
                img.alt = recipe.name;
                img.onerror = () => img.remove();
                detail.appendChild(img);
            }

            /* Recipe title */
            const h1 = document.createElement('h1');
            h1.innerText = recipe.name;
            detail.appendChild(h1);

            /* Scale control row */
            const scaleControls = document.createElement('div');
            scaleControls.className = 'scale-controls';

            const scaleLabel = document.createElement('span');
            scaleLabel.innerText = 'Scale:';
            scaleControls.appendChild(scaleLabel);

            const scales = [{
                val: 0.5,
                label: '½×'
            }, {
                val: 1,
                label: '1×'
            }, {
                val: 2,
                label: '2×'
            }];
            const scaleBtns = [];

            scales.forEach(s => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-scale';
                btn.innerText = s.label;
                if (s.val === scale) btn.classList.add('selected'); // 1× selected by default

                btn.onclick = () => {
                    scale = s.val;
                    // Sync which button looks "selected"
                    scaleBtns.forEach((b, i) => b.classList.toggle('selected', scales[i].val === scale));
                    renderIngTable(); // re-render with new scale
                };

                scaleBtns.push(btn);
                scaleControls.appendChild(btn);
            });

            detail.appendChild(scaleControls);

            /* Ingredient table wrapper — rebuilt on scale change */
            const ingTableWrapper = document.createElement('div');
            detail.appendChild(ingTableWrapper);

            function renderIngTable() {
                // Clear the old table
                while (ingTableWrapper.firstChild) ingTableWrapper.removeChild(ingTableWrapper.firstChild);

                if (recipe.ingredients.length === 0) {
                    const p = document.createElement('p');
                    p.innerText = 'No ingredients listed.';
                    p.style.color = 'var(--muted)';
                    ingTableWrapper.appendChild(p);
                    return;
                }

                const pantry = loadIngredients(); // fresh data every render

                const table = document.createElement('table');
                table.className = 'ing-table';

                // Table header row
                const thead = document.createElement('thead');
                const headerRow = document.createElement('tr');
                ['Ingredient', 'Needed', 'Have'].forEach(h => {
                    const th = document.createElement('th');
                    th.innerText = h;
                    headerRow.appendChild(th);
                });
                thead.appendChild(headerRow);
                table.appendChild(thead);

                const tbody = document.createElement('tbody');

                recipe.ingredients.forEach(ri => {
                    const pantryIng = pantry.find(p => p.id === ri.ingredientId);
                    const scaledQty = ri.qty * scale; // apply the current scale multiplier
                    const tr = document.createElement('tr');

                    const tdName = document.createElement('td');
                    const tdNeed = document.createElement('td');
                    const tdHave = document.createElement('td');

                    if (!pantryIng) {
                        // The ingredient was deleted from the pantry after the recipe was saved
                        tdName.innerText = '(Deleted Ingredient)';
                        tdName.className = 'insufficient';
                        tdNeed.innerText = `${formatQty(scaledQty)} ${ri.unit}`;
                        tdNeed.className = 'insufficient';
                        tdHave.innerText = 'Not in pantry';

                    } else {
                        // Convert the needed amount from recipe unit → pantry canonical unit for comparison
                        const needed = convertToCanonical(scaledQty, ri.unit, pantryIng.canonicalUnit);
                        const have = pantryIng.canonicalQty;
                        const sufficient = needed !== null && have >= needed; // do we have enough?

                        tdName.innerText = pantryIng.name;
                        tdNeed.innerText = `${formatQty(scaledQty)} ${pluralizeUnit(scaledQty, ri.unit)}`;

                        const haveUnit = pantryIng.type === 'discrete' ?
                            pluralizeUnit(have, 'unit') // "unit" or "units"
                            :
                            pantryIng.canonicalUnit;
                        tdHave.innerText = `${formatQty(have)} ${haveUnit}`;

                        // Highlight in red if the pantry can't cover the needed amount
                        if (!sufficient) {
                            tdName.className = 'insufficient';
                            tdNeed.className = 'insufficient';
                        }
                    }

                    tr.appendChild(tdName);
                    tr.appendChild(tdNeed);
                    tr.appendChild(tdHave);
                    tbody.appendChild(tr);
                });

                table.appendChild(tbody);
                ingTableWrapper.appendChild(table);
            }

            renderIngTable(); // initial render

            /* Cook Recipe button */
            const cookBtn = document.createElement('button');
            cookBtn.className = 'btn btn-success';
            cookBtn.style.marginTop = '0.75rem';
            cookBtn.innerText = '🍳 Cook Recipe';
            // Pass renderIngTable as a callback so the table refreshes after cooking
            cookBtn.onclick = () => cookRecipe(recipe, scale, renderIngTable);
            detail.appendChild(cookBtn);

            /* Instructions section */
            const hr2 = document.createElement('hr');
            hr2.className = 'divider';
            detail.appendChild(hr2);

            const instrLabel = document.createElement('p');
            instrLabel.className = 'section-label';
            instrLabel.innerText = 'Instructions';
            detail.appendChild(instrLabel);

            const instrEl = document.createElement('div');
            instrEl.className = 'recipe-instructions';
            instrEl.innerText = recipe.instructions; // innerText preserves newlines and is XSS safe
            detail.appendChild(instrEl);

            /* Edit shortcut at the bottom of the page */
            const editBtn = document.createElement('button');
            editBtn.className = 'btn btn-outline';
            editBtn.style.marginTop = '1.5rem';
            editBtn.innerText = '✏️ Edit Recipe';
            editBtn.onclick = () => navigate('recipe-form', recipe.id);
            detail.appendChild(editBtn);

            container.appendChild(detail);
        }

        /* =====================================================================
           COOK RECIPE
           Steps:
             1. Validate that every ingredient exists in the pantry
             2. Validate that unit conversion is possible
             3. Validate that the pantry has enough of each ingredient
             4. Only if ALL checks pass: deduct from pantry and show success
           ===================================================================== */

        function cookRecipe(recipe, scale, afterCallback) {
            const pantry = loadIngredients();
            const errors = []; // collect all problems before showing anything
            const deductions = []; // queued: { pantry index, amount to remove }

            recipe.ingredients.forEach(ri => {
                const idx = pantry.findIndex(p => p.id === ri.ingredientId);

                // 1. Missing from pantry
                if (idx === -1) {
                    errors.push('An ingredient is missing from your pantry.');
                    return;
                }

                const pantryIng = pantry[idx];
                const scaledQty = ri.qty * scale;
                const neededCanon = convertToCanonical(scaledQty, ri.unit, pantryIng.canonicalUnit);

                // 2. Unit mismatch (e.g. recipe uses "cup" but pantry canonical unit is "g")
                if (neededCanon === null) {
                    errors.push(`Unit mismatch for "${pantryIng.name}": can't convert ${ri.unit} → ${pantryIng.canonicalUnit}.`);
                    return;
                }

                // 3. Insufficient quantity
                if (pantryIng.canonicalQty < neededCanon) {
                    errors.push(`Not enough "${pantryIng.name}" — need ${formatQty(neededCanon)} ${pantryIng.canonicalUnit}, have ${formatQty(pantryIng.canonicalQty)}.`);
                    return;
                }

                // All good — queue this deduction
                deductions.push({
                    idx,
                    amount: neededCanon
                });
            });

            // If any check failed, show all errors and stop — don't touch the pantry
            if (errors.length > 0) {
                showFlash(errors.join(' | '), 'error');
                return;
            }

            // Apply all deductions atomically (only reached if zero errors above)
            deductions.forEach(({
                idx,
                amount
            }) => {
                pantry[idx].canonicalQty = Math.max(0, pantry[idx].canonicalQty - amount);
            });

            saveIngredients(pantry);
            showFlash('Meal cooked — pantry updated! 🎉');

            // Re-render the ingredient table so "Have" column reflects new pantry amounts
            if (typeof afterCallback === 'function') afterCallback();
        }

        /* =====================================================================
           HELPER: makeFormGroup
           Builds a labeled form field group (<div> with <label> + <input>).
           Centralizes the repetitive pattern of creating labeled inputs.

           Parameters:
             labelText  — the text shown in the <label>
             inputType  — "text", "number", "url", or "textarea"
             name       — the input's name attribute
             value      — pre-filled value (e.g. when editing)
             placeholder — hint text shown inside the input
             required   — if true, appends " *" to the label
           ===================================================================== */

        function makeFormGroup(labelText, inputType, name, value, placeholder, required) {
            const group = document.createElement('div');
            group.className = 'form-group';

            const lbl = document.createElement('label');
            lbl.innerText = labelText + (required ? ' *' : '');

            // Use <textarea> for multi-line input; <input> for everything else
            const input = document.createElement(inputType === 'textarea' ? 'textarea' : 'input');
            if (inputType !== 'textarea') input.type = inputType;
            input.name = name;
            input.value = value || '';
            input.placeholder = placeholder || '';

            group.appendChild(lbl);
            group.appendChild(input);
            return group;
        }

        /* =====================================================================
           BOOT
           Kick things off by rendering the home page when the script loads.
           ===================================================================== */
        navigate('home');
    </script>
</body>

</html>
